[agent]
  omit_hostname = true
  # Write to InfluxDB often, so that when the controller dumps the database at the end of an experiment
  # (INFLUX_WRITE_WAIT after it ends, see controller/src/controller_helper.py), everything until then has been written
  flush_interval = "1s"
  debug = false
  quiet = false

################################################################################
# Inputs

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "telegraf"

  topics = [
    "#",
  ]

  # Nested keys are stored with their full path, joined by "_" (e.g. state.status as state_status),
  # so keys in different parts of a message don't collide. Lists are stored by index (e.g. variables_0).
  # Nulls, and empty objects and lists, have no value to store.
  data_format = "json"
  json_string_fields = ["*"]

################################################################################
# Outputs

[[outputs.influxdb_v2]]
urls = ["${INFLUX_ADDR}"]
token = "${INFLUX_TOKEN}"
organization = "${INFLUX_ORG}"
bucket = "${INFLUX_BUCKET}"

#[[outputs.file]]
  
################################################################################
# Processors

[[processors.starlark]]
 # Reads the Starlark script embedded
 source = '''
load("logging.star", "log")
def apply(metric):
  for k, v in metric.fields.items():  # iterate safely while deleting
    if type(v) == "bool":
      # Booleans are stored as strings, like the other non-numeric values
      metric.fields[k] = "true" if v else "false"
    elif (type(v) != "float") and (type(v) != "string"):
      metric.fields.pop(k)
      log.warn("Dropped {},{},{},{}".format(metric.name, k, type(v), v))
  return metric
'''

[[processors.pivot]]
    tag_key = "field"
    value_key = "value"
