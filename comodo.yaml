global:
  heartbeat:
    interval: 1
  instrument_setup:
    wait: 10
  experiment_monitoring:
    max_missed_heartbeats: 3
    bad_state_tolerance: 7
    missed_setpoint_tolerance: 7
  watchdog:
    timeout: 5
    interval: 1

instruments:
  furnace:
    firmware: eurotherm.3204
    address: "/dev/ttyAMA0"
    simulate: false
    variables:
      temperature:
        min: 0
        max: 1000
        unit: C
        tolerance: 1
        default_setpoint: 10
        sensor:
          interval: 1
          type: float
        actuator:
          type: float
          safe_stop_setpoint: 0
  transformer:
    firmware: adafruit.ads1115
    address: /dev/i2c-1
    device_id: "0x48"
    simulate: false
    simulation_inputs: { power: furnace/temperature }
    variables:
      input_current:
        min: 0
        max: 13
        unit: A
        tolerance: 0.1
        sensor:
          interval: 1
          type: float
      input_voltage:
        min: 0
        max: 300
        unit: V
        tolerance: 1
        sensor:
          interval: 1
          type: float
      output_current:
        min: 0
        max: 200
        unit: A
        tolerance: 1
        sensor:
          interval: 1
          type: float
      output_voltage:
        min: 0
        max: 200
        unit: V
        tolerance: 1
        sensor:
          interval: 1
          type: float
  pressure:
    firmware: pfeiffer.mpt200
    address: "/dev/ttyUSB0"
    simulate: true
    variables:
      pressure:
        min: 1
        max: 200
        unit: bar
        tolerance: 0.5
        default_setpoint: 1
        sensor:
          interval: 1
          type: float
  mass_flow:
    firmware: bronkhorst.el_flow_select
    address: "/dev/ttyUSB2"
    device_id: 128
    simulate: true
    variables:
      mass_flow:
        min: 0
        max: 100
        unit: \%
        sensor:
          interval: 1
          type: float
        actuator:
          type: float
          safe_stop_setpoint: 0
        setpoint_controller:
          external_sensor: pressure/pressure
          K_P: 10.0
          K_I: 1.0
          K_D: 0.1
          K_AW: 0.05
          K_DF: 0.01
