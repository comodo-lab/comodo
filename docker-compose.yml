name: comodo-nexus
services:
  rabbitmq:
    image: docker.io/bitnami/rabbitmq:3.12
    container_name: comodo-rabbitmq
    restart: unless-stopped
    profiles: [mqtt]
    ports:
      - '1883:1883'
    environment:
      - RABBITMQ_SECURE_PASSWORD=yes
      - RABBITMQ_DISK_FREE_RELATIVE_LIMIT=1.0
      - RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT=500MB
      - RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS=true
      - RABBITMQ_USERNAME=${MQTT_USER}
      - RABBITMQ_PASSWORD=${MQTT_PASS}
      - RABBITMQ_PLUGINS=rabbitmq_mqtt,rabbitmq_management
      - RABBITMQ_LOGS=-
    volumes:
      - rabbitmq_data:/bitnami/rabbitmq/mnesia
    networks:
      comodo:

  mqtt-probe:
    image: eclipse-mosquitto:2
    command: tail -f /dev/null   # keep container running
    environment:
      MQTT_HOST: ${MQTT_BROKER_ADDRESS}
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
    healthcheck:
      test: ["CMD-SHELL", "/probe.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./nexus/probe.sh:/probe.sh:ro
    networks:
      comodo:

  influxdb:
    image: influxdb:latest
    container_name: comodo-influx
    restart: unless-stopped
    profiles: [live]
    depends_on:
      mqtt-probe:
        condition: service_healthy
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=influx
      - DOCKER_INFLUXDB_INIT_PASSWORD=influxinflux
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUX_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUX_BUCKET}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    ports:
      - 8086:8086
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    networks:
      comodo:

  telegraf:
    image: telegraf:latest
    container_name: comodo-telegraf
    restart: unless-stopped
    profiles: [live]
    depends_on:
      - influxdb
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - ORG=comodo
      - DATA_BUCKET=comodo
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_URL=http://comodo-influx:8086
      - RABBIT_URL=tcp://comodo-rabbitmq:1883
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      comodo:

  grafana:
    build:
      context: .
      dockerfile_inline: |
        FROM grafana/grafana
        USER root
        RUN apk add envsubst
        ARG INFLUX_TOKEN=${INFLUX_TOKEN}
        ARG INFLUX_BUCKET=${INFLUX_BUCKET}
        ARG INFLUX_ORG=${INFLUX_ORG}
        COPY ./grafana/provisioning/ /etc/grafana/provisioning/
        RUN envsubst < /etc/grafana/provisioning/datasources/datasource.yml.template > /etc/grafana/provisioning/datasources/datasource.yml.temp
        RUN cp /etc/grafana/provisioning/datasources/datasource.yml.temp /etc/grafana/provisioning/datasources/datasource.yml
        RUN /sbin/reboot
        USER grafana
    container_name: comodo-grafana
    restart: unless-stopped
    profiles: [live]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    ports:
      - 3000:3000
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards
      - ./grafana/dashboard.yaml:/etc/grafana/provisioning/dashboards/main.yaml
    networks:
      comodo:

  controller:
    build:
      context: ./
      dockerfile: controller/Dockerfile
    env_file:
      - .env
    container_name: comodo-controller
    restart: unless-stopped
    depends_on:
      mqtt-probe:
        condition: service_healthy
    volumes:
      - ./controller/data:/controller/data
    networks:
      comodo:

  ui:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim
        COPY ui/requirements.txt ./requirements.txt
        RUN pip install -r ./requirements.txt
        COPY ui /app
        COPY utils/mqtt_clients.py /app/mqtt_clients.py
        COPY utils/interpolation.py /app/interpolation.py
        CMD ["python", "-u", "/app/app.py"]
    container_name: comodo-ui
    restart: unless-stopped
    depends_on:
      mqtt-probe:
        condition: service_healthy
    ports:
      - '8501:8050'
    volumes:
      - ./ui/:/app/
      - ./utils:/app/utils
    environment:
      - MQTT_ADDR=${MQTT_BROKER_ADDRESS}
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - INFLUX_ADDR=${INFLUX_ADDR}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_ORG=${INFLUX_ORG}
      - FRONTEND_GRAFANA_URL=${FRONTEND_GRAFANA_URL}
    networks:
      - comodo

networks:
  comodo:
    name: comodo

volumes:
  rabbitmq_data:
    name: comodo-rabbitmq
  influx_data:
    name: comodo-influx
  influx_config:
    name: comodo-influx-config
  grafana-storage:
    name: comodo-grafana
