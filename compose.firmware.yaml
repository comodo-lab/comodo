# Generated by compose-gen from comodo.yaml
# Do not edit directly -- edit comodo.yaml and regenerate.

x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  instrument-env: &instrument-env
    <<: *mqtt-env
    SIMULATE: ${SIMULATE_INSTRUMENTS:-false}
  python-instrument-template: &python-instrument-template
    build:
      context: .
      dockerfile: firmware/Dockerfile
    depends_on:
      mqtt-probe-firmware:
        condition: service_healthy

name: comodo-firmware

services:
  mqtt-probe-firmware:
    image: comodolab/comodo-mqtt_probe:latest
    environment:
      <<: *mqtt-env
      MQTT_PROBE_ID: firmware

  furnace_centre:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "furnace_centre"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: "192.168.111.222"
      ACTIVE_VARIABLES: '["temperature"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_TEMPERATURE: 1000

  furnace_left:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "furnace_left"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: "192.168.111.224"
      ACTIVE_VARIABLES: '["temperature"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_TEMPERATURE: 1000

  furnace_right:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "furnace_right"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: "192.168.111.225"
      ACTIVE_VARIABLES: '["temperature"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_TEMPERATURE: 1000

  pressure_downstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "pressure_downstream"
      FIRMWARE: pfeiffer.mpt200
      DEVICE_ADDRESS: "/dev/ttyUSB0"
      ACTIVE_VARIABLES: '["pressure"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_PRESSURE: 1000
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true

  pressure_upstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "pressure_upstream"
      FIRMWARE: pfeiffer.mpt200
      DEVICE_ADDRESS: "/dev/ttyUSB1"
      ACTIVE_VARIABLES: '["pressure"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_PRESSURE: 500
    devices:
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    privileged: true

  mass_flow:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "mass_flow"
      FIRMWARE: bronkhorst.el_flow_select
      DEVICE_ADDRESS: "/dev/ttyUSB2"
      ACTIVE_VARIABLES: '["mass_flow", "temperature", "pressure_upstream", "pressure_downstream"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_MASS_FLOW: 1000
      INTERVAL_TEMPERATURE: 1000
      INTERVAL_PRESSURE_UPSTREAM: 1000
      INTERVAL_PRESSURE_DOWNSTREAM: 1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true

  mass_spec:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "mass_spec"
      FIRMWARE: pfeiffer.prisma_pro
      DEVICE_ADDRESS: "192.168.1.100"
      ACTIVE_VARIABLES: '["mass_spec"]'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_MASS_SPEC: 1000

  spc-mass_flow-mass_flow:
    build:
      context: .
      dockerfile: setpoint_controller/Dockerfile
    depends_on:
      mqtt-probe-firmware:
        condition: service_healthy
    environment:
      <<: *mqtt-env
      HEARTBEAT_INTERVAL: 1000
      SENSOR: "pressure_upstream/pressure"
      ACTUATOR: "mass_flow/mass_flow"
      K_P: 10.0
      K_I: 1.0
      K_D: 0.1
      K_AW: 0.05
      K_DF: 0.01
      OUT_MIN: 0
      OUT_MAX: 100


volumes:
  massflow_read:

