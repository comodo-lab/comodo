name: comodo-core

services:
  config:
    image: docker.io/linkml/linkml
    command: linkml-validate -s schema.yaml config.yaml
    working_dir: /work
    volumes:
      - ./comodo.yaml:/work/config.yaml
      - ./comodo.yaml.schema:/work/schema.yaml

  mqtt-probe-core:
    build:
      context: .
      dockerfile_inline: |
        FROM eclipse-mosquitto:2
        COPY ./nexus/probe.sh /probe.sh
        CMD ["/bin/sh", "/probe.sh"]
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
    healthcheck:
      test: ["CMD-SHELL", "exit $(cat /tmp/mqtt-health 2>/dev/null || echo 1)"]
      interval: 1s
      timeout: 10s
      retries: 10
    networks:
      comodo-core:

  controller:
    build:
      context: ./
      dockerfile: controller/Dockerfile
    env_file:
      - .env
    container_name: comodo-controller
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    volumes:
      - ./controller/data:/controller/data
    networks:
      comodo-core:

  ui:
    build:
      context: ./
      dockerfile: ui/Dockerfile
    container_name: comodo-ui
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    ports:
      - '8501:8050'
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=1883
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - INFLUX_HOST=${INFLUX_HOST}
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_BUCKET=${INFLUX_BUCKET}
      - INFLUX_ORG=${INFLUX_ORG}
      - FRONTEND_GRAFANA_URL=${FRONTEND_GRAFANA_URL}
    networks:
      comodo-core:

networks:
  comodo-core:
    name: comodo-core
