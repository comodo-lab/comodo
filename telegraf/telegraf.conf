[agent]
  omit_hostname = true
  debug = true
  quiet = false
  logtarget = "stderr"  # or "stderr"

################################################################################
# Inputs

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "telegraf"

  topics = [
    "#",
  ]

  data_format = "json_v2"
  
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
       path = "@this"
       tags = [""]
       disable_prepend_keys = true

################################################################################
# Outputs

[[outputs.influxdb_v2]]
urls = ["${INFLUX_ADDR}"]
token = "${INFLUX_TOKEN}"
organization = "${INFLUX_ORG}"
bucket = "${INFLUX_BUCKET}"

#[[outputs.file]]
  
################################################################################
# Processors

[[processors.starlark]]
 # Reads the Starlark script embedded
 source = '''
load("logging.star", "log")
def apply(metric):
  for k, v in metric.fields.items():  # iterate safely while deleting
    if (type(v) != "float") and (type(v) != "string"):
	metric.fields.pop(k)
	log.warn("Dropped {},{},{},{}".format(metric.name, k, type(v), v))
	
  return metric
'''

[[processors.pivot]]
    tag_key = "field"
    value_key = "value"
