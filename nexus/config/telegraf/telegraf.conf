################################################################################
# Sensor inputs

[agent]
  omit_hostname = true

################################################################################
# Heartbeat inputs

[[inputs.mqtt_consumer]]
  servers = ["tcp://fase-rabbitmq:1883"]
  username = "sensor"
  password = "foobar!!"
  client_id = "telegraf"

  topics = [
    "heartbeat/#",
    "measurement/#",
    "controller/#",
    "sensor/#",
    "timer/#",
    "error/#",
  ]

  data_format = "json_v2"
  
  ## Heartbeats
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "heartbeat/controller"
    measurement = "heartbeat/_"
    tags = "_/system_name"

  [[inputs.mqtt_consumer.topic_parsing]] 
    topic = "heartbeat/sensor/+" 
    measurement = "heartbeat/_/_" 
    tags = "_/system_name/system_id"

  ## Setpoints
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sensor/setpoint"
    measurement = "sensor/_"
    tags = "_/setpoint"

  ## Measurements
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "measurement/+"
    measurement = "reading/_"
    tags = "_/reading_id"

  ## Logging
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "controller/+"
    measurement = "controller/_"
    tags = "_/topic"

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "sensor/+/setup"
    measurement = "sensor/_/setup"
    tags = "_/system_id/_"

  ## Errors
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "error/+"
    measurement = "error/_"
    tags = "_/system_id"



  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
       path = "@this"
       tags = [""]
       disable_prepend_keys = false
       
