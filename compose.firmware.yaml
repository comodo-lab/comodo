x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  instrument-env: &instrument-env
    <<: *mqtt-env
    SIMULATE: ${SIMULATE_SENSORS:-false}
  python-instrument-template: &python-instrument-template
    build:
      context: .
      dockerfile: firmware/Dockerfile
    networks:
      comodo-firmware:
    depends_on:
      mqtt-probe-firmware:
        condition: service_healthy
      
name: comodo-firmware
services:
  mqtt-probe-firmware:
    image: williamjsmith15/comodo-mqtt_probe:latest
    environment:
      <<: *mqtt-env
    networks:
      comodo-firmware:

  # furnace_centre:
  #   <<: *python-instrument-template
  #   environment:
  #     <<: *instrument-env
  #     INSTRUMENT_ID: "furnace_centre"
  #     FIRMWARE: carbolite_gero_thermocouple
  #     DEVICE_ADDRESS: 192.168.111.222
  #     HEARTBEAT_INTERVAL: 1000
  #     MEASUREMENT_INTERVAL: 1000

  # furnace_left:
  #   <<: *python-instrument-template
  #   environment:
  #     <<: *instrument-env
  #     INSTRUMENT_ID: "furnace_left"
  #     FIRMWARE: carbolite_gero_thermocouple
  #     DEVICE_ADDRESS: 192.168.111.224
  #     HEARTBEAT_INTERVAL: 1000
  #     MEASUREMENT_INTERVAL: 1000

  # furnace_right:
  #   <<: *python-instrument-template
  #   environment:
  #     <<: *instrument-env
  #     INSTRUMENT_ID: "furnace_right"
  #     FIRMWARE: carbolite_gero_thermocouple
  #     DEVICE_ADDRESS: 192.168.111.225
  #     HEARTBEAT_INTERVAL: 1000
  #     MEASUREMENT_INTERVAL: 1000

  pressure_downstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "pressure_downstream"
      FIRMWARE: pfeiffer_mpt_200_pressure
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
      DEVICE_ADDRESS: /dev/ttyUSB0
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true

  pressure_upstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "pressure_upstream"
      FIRMWARE: pfeiffer_mpt_200_pressure
      DEVICE_ADDRESS: /dev/ttyUSB1
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    devices:
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    privileged: true

  setpoint-controller:
    build:
      context: .
      dockerfile: setpoint_controller/Dockerfile
    networks:
      comodo-firmware:
    environment:
      <<: *mqtt-env
      HEARTBEAT_INTERVAL: 1000
      SENSOR: "pressure_upstream/pressure"
      ACTUATOR: "mass_flow"
      K_P: 1
      K_I: 0.1
      K_D: 0.05
      K_AW: 0.05
      K_DF: 0.01
      OUT_MIN: 0
      OUT_MAX: 100
      # OUT_MAX_R: 10

  mass_flow:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "mass_flow"
      FIRMWARE: el_flow_select_massflow
      DEVICE_ADDRESS: /dev/ttyUSB2
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    devices: 
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true 
    volumes:
      - mass_flow_read:/shared

networks:
  comodo-firmware:
    name: comodo-firmware

volumes:
  mass_flow_read:
