name: test

on:
  workflow_dispatch: # manual invocation
  push:
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, linux, ARM64]
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set PATH
        echo "PATH=/home/owool/.local/bin:/home/owool/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" >> "$GITHUB_ENV"

      - name: Run tests
        run: |
          printf '%s\n' '$PATH'
          micropython -m lib.unittest
