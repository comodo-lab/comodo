services:
  temp_main:
    build:
      dockerfile_inline: |
        FROM micropython/unix
        WORKDIR /sensor
        COPY . .
        CMD micropython main.py
    network_mode: host
    environment:
      - SENSOR_ID="temp_main"
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
  temp_left:
    build:
      dockerfile_inline: |
        FROM micropython/unix
        WORKDIR /sensor
        COPY . .
        CMD micropython main.py
    network_mode: host
    environment:
      - SENSOR_ID="temp_left"
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
  temp_right:
    build:
      dockerfile_inline: |
        FROM micropython/unix
        WORKDIR /sensor
        COPY . .
        CMD micropython main.py
    network_mode: host
    environment:
      - SENSOR_ID="temp_right"
      - HEARTBEAT_INTERVAL=2000
      - MEASUREMENT_INTERVAL=2000
