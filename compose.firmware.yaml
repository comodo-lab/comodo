x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  sensor-env: &sensor-env
    <<: *mqtt-env
    SIMULATE: ${SIMULATE_SENSORS:-false}
  python-sensor-template: &python-sensor-template
    build:
      context: .
      dockerfile: firmware/Dockerfile
    networks:
      comodo-firmware:

name: comodo-firmware
services:
  mqtt-probe-firmware:
    image: comodolab/comodo-mqtt_probe:latest
    environment:
      <<: *mqtt-env
    networks:
      comodo-firmware:

  temp_main:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: temp_main
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  temp_left:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: temp_left
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  temp_right:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: temp_right
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  pressure_downstream:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: pressure_downstream
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true

  pressure_upstream:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: pressure_upstream
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    devices:
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    privileged: true  # Optional but recommended for USB/serial access

  setpoint-controller:
    build:
      context: .
      dockerfile: setpoint_controller/Dockerfile
    networks:
      comodo-firmware:
    environment:
      <<: *mqtt-env
      HEARTBEAT_INTERVAL: 1000
      SENSOR: pressure_upstream
      ACTUATOR: massflow
      K_P: 1
      K_I: 0.1
      K_D: 0.05
      K_AW: 0.05
      K_DF: 0.01
      OUT_MIN: 0
      OUT_MAX: 100
      # OUT_MAX_R: 10

  massflow:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: massflow
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    devices: # Critical this is up as all other massflow sensors read from this device
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true  # Optional but recommended for USB/serial access
    volumes:
      - massflow_read:/shared

  massflow_pressure_upstream:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: massflow_pressure_upstream
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    volumes:
      - massflow_read:/shared

  massflow_pressure_downstream:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: massflow_pressure_downstream
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    volumes:
      - massflow_read:/shared

  massflow_fluid_temp:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: massflow_fluid_temp
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    volumes:
      - massflow_read:/shared

  massflow_temp:
    <<: *python-sensor-template
    environment:
      <<: *sensor-env
      SENSOR_ID: massflow_temp
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    volumes:
      - massflow_read:/shared

networks:
  comodo-firmware:
    name: comodo-firmware

volumes:
  massflow_read:
