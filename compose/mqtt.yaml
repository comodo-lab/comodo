name: mqtt_broker

services:

  rabbitmq:
    image: rabbitmq:4.1.3
    container_name: comodo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MQTT_USER}
      RABBITMQ_DEFAULT_PASS: ${MQTT_PASS}
      RABBITMQ_ENABLED_PLUGINS: rabbitmq_mqtt
    ports:
      - '1883:1883'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

# Shared by all the stacks on the same host. The first stack to start creates it,
# so the others warn that it "was not created for project ...", which is expected.
networks:
  default:
    name: comodo
