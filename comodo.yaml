  pressure_downstream:
    firmware: pfeiffer/mpt200
    address: "/dev/ttyUSB0"
    variables:
      pressure:
        sensor:
          type: float
          min: 0
          max: 10
          unit: bar
  pressure_upstream:
    firmware: pfeiffer/mpt200
    address: "/dev/ttyUSB1"
    measurement_interval: 0.5s
    variables:
      pressure:
        sensor:
          type: float
          min: 0
          max: 10
          unit: bar
  mass_flow:
    firmware: bronkhorst/el_flow_select
    address: "/dev/ttyUSB2"
    variables:
      mass_flow:
        sensor:
          type: float
          min: 0
          max: 100
          unit: \%
        actuator:
          type: float
          min: 0
          max: 100
          unit: \%
        setpoint_controller:
          external_sensor: pressure_upstream.pressure
          P: 10.0
          I: 1.0
          D: 0.1
          output_function: "sigma"
      temperature:
        sensor:
          type: float
          min: 0
          max: 100
          unit: °C
      pressure_upstream:
        sensor:
          type: float
          min: 0
          max: 10
          unit: bar
      pressure_downstream:
        sensor:
          type: float
          min: 0
          max: 10
          unit: bar

