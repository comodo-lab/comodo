name: rpi-ci-cd

on:
  workflow_dispatch: # manual invocation
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false

    runs-on: rpi-testing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configure poetry
        run: |
          poetry config virtualenvs.in-project true

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: rpi-testing-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install

      - name: Run tests
        run: |
          sleep 3
          poetry run python -m pytest tests --verbose -k "not _skip_ci" --reruns 2 --reruns-delay 1

  stage:
    needs: test
    runs-on: rpi-staging
    steps:
      - name: Stop systemctl service
        run: sudo systemctl stop fase-controller

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Create config
        env:
          CONTROLLER_USER: ${{ secrets.CONTROLLER_MQTT_USER }}
          CONTROLLER_PASS: ${{ secrets.CONTROLLER_MQTT_PASS }}
          BROKER_ADDRESS: ${{ secrets.BROKER_ADDRESS }}
        run: |
          jq --null-input \
            --arg cu $CONTROLLER_USER \
            --arg cp $CONTROLLER_PASS \
            --arg ba $BROKER_ADDRESS \
            '{broker_address: $ba, user: $cu, password: $cp}' > config.json

      - name: Configure poetry
        run: |
          poetry config virtualenvs.in-project true

      - name: Cache the virtualenv
        uses: actions/cache@v4
        with:
          path: ./.venv
          key: rpi-staging-venv-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          poetry install

      - name: Start service
        run: |
          sudo systemctl start fase-controller
