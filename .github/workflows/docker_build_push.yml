name: Publish Docker images

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

jobs:
  push_to_dockerhub:
    name: Build and push controller & UI images to Docker Hub
    runs-on: ubuntu-latest

    env:
      DOCKERHUB_NAMESPACE: comodolab
      CONTROLLER_IMAGE_NAME: comodo-controller
      UI_IMAGE_NAME: comodo-ui

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set tag variables
        id: vars
        run: |
          DATE=$(date +'%Y%m%d')
          echo "DATE=$DATE" >> $GITHUB_ENV

          BRANCH="${GITHUB_REF_NAME}"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

          # sanitise branch name for tags (for non-main/dev)
          SAFE_BRANCH=$(echo "$BRANCH" | tr '/ ' '--')
          echo "BRANCH_SAFE=$SAFE_BRANCH" >> $GITHUB_ENV

          if [ "$BRANCH" = "main" ]; then
            # main → <date>, latest
            echo "DATE_TAG=$DATE" >> $GITHUB_ENV
            echo "LATEST_TAG=latest" >> $GITHUB_ENV
          elif [ "$BRANCH" = "dev" ]; then
            # dev → <date>-dev, latest-dev
            echo "DATE_TAG=${DATE}-dev" >> $GITHUB_ENV
            echo "LATEST_TAG=latest-dev" >> $GITHUB_ENV
          else
            # other branches (manual runs etc.) → <date>-<branch>, latest-<branch>
            echo "DATE_TAG=${DATE}-${SAFE_BRANCH}" >> $GITHUB_ENV
            echo "LATEST_TAG=latest-${SAFE_BRANCH}" >> $GITHUB_ENV
          fi

      - name: Build and push controller image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.CONTROLLER_IMAGE_NAME }}:${{ env.DATE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.CONTROLLER_IMAGE_NAME }}:${{ env.LATEST_TAG }}

      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.UI_IMAGE_NAME }}:${{ env.DATE_TAG }}
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ env.UI_IMAGE_NAME }}:${{ env.LATEST_TAG }}