[agent]
  omit_hostname = true

################################################################################
# Inputs

[[inputs.mqtt_consumer]]
  servers = ["${RABBIT_URL}"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "telegraf"

  topics = [
    "#",
  ]

  data_format = "json_v2"
  
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
       path = "@this"
       tags = [""]
       disable_prepend_keys = true

################################################################################
# Outputs

[[outputs.influxdb_v2]]
urls = ["${INFLUX_URL}"]
token = "${INFLUX_TOKEN}"
organization = "${ORG}"
bucket = "${DATA_BUCKET}"

[[outputs.file]]
  
################################################################################
# Processors

[[processors.starlark]]
 # Reads the Starlark script embedded
 source = '''
def apply(metric):
  for k,v in metric.fields.items():
    if type(v) != "float":
      return None
    return metric
'''

[[processors.pivot]]
    tag_key = "field"
    value_key = "value"