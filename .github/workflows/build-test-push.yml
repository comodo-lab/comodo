name: build-test-push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-push-rclient:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CONTAINER_NAME: fase-controller
      CONTEXT: ./
      DOCKERFILE: Dockerfile
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: ${{ env.CONTAINER_NAME }}:testing
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test
        run: |
          output=$(docker run ${{ env.CONTAINER_NAME }}:testing sh -c "apt-get update -y && apt-get install -y mosquitto && mosquitto -d && python -m pytest tests --verbose -k 'not _skip_ci' --reruns 2 --reruns-delay 1")
          echo "$output"
          if [[ "$output" == *"FAIL"* || "$output" != *"PASSED"* ]]; then
            echo -e "\n\n    ERROR: Testing inside container failed.\n\n"
            status=1
          else
            echo "All tests passed"
            status=0
          fi

          exit $status
        
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push latest
        run: |
          docker image tag ${{ env.CONTAINER_NAME }}:testing ghcr.io/uomresearchit/${{ env.CONTAINER_NAME }}:latest
          docker push ghcr.io/uomresearchit/${{ env.CONTAINER_NAME }}:latest