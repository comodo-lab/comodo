name: RPI

on:
  workflow_dispatch: # manual invocation
  push:
  pull_request:

jobs:
  raspberry-pi-test:
    runs-on: rpi-testing
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Generate config
        env:
          PI_IP: ${{ secrets.OWOOL_PI_IP }}
          WIFI_SSID: ${{ secrets.OWOOL_WIFI_SSID }}
          WIFI_PASS: ${{ secrets.OWOOL_WIFI_PASS }}
        run: |
          jq --null-input \
             --arg ip $PI_IP \
             --arg ws $WIFI_SSID \
             --arg wp $WIFI_PASS \
             '{MQTT_IP: $ip, WIFI_SSID: $ws, WIFI_PASS: $wp}' > env.json
      - name: Run tests
        run: |
          printf "%s\n" "$PATH"
          micropython -m lib.unittest
