
# This compose file runs the tests for the controller and exits when done.
# To run the tests, cd into controller/ and execute:
#   docker compose up --build

name: controller-tests
services:
  controller:
    build:
      context: ../
      dockerfile: controller/Dockerfile
    container_name: controller-test
    volumes:
      - memory:/memory  # Used to persist pytest cache between runs
    command:  bash -c "coverage run -m pytest
      tests/unit/test_controller_helper.py
      tests/unit/test_controller_idle.py
      tests/unit/test_controller_ready.py
      tests/unit/test_controller_running.py
      tests/unit/test_controller_starting.py
      tests/unit/test_controller_state.py
      tests/unit/test_controller_stop.py
      -vv && echo '' && coverage report && coverage html -d /memory/htmlcov"

volumes:
  memory:
