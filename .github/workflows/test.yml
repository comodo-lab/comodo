name: test

on:
  workflow_dispatch: # manual invocation
  push:
  pull_request:

jobs:
  raspberry-pi-test:
    runs-on: [self-hosted, linux, ARM64]
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
        env:
          OWOOL_PI_IP: ${{ OWOOL_PI_IP }}
          OWOOL_WIFI_SSID: ${{ OWOOL_WIFI_SSID }}
          OWOOL_WIFI_PASS: ${{ OWOOL_WIFI_PASS }}
        run: |
          jq --null-input \
             --arg ip "${{ OWOOL_PI_IP \
             --arg ws "${{ OWOOL_WIFI_SSID \
             --arg wp "${{ OWOOL_WIFI_PASS \
             '{MQTT_IP: $ip, WIFI_SSID: $ws, WIFI_PASS: $wp}' > env.json
          echo env.json
      - name: Run tests
        run: |
          printf "%s\n" "$PATH"
          micropython -m lib.unittest

  raspberry-pi-pico-test:
    runs-on: [self-hosted, linux, ARM64]
    strategy:
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Generate config
        env:
          OWOOL_PI_IP: ${{ OWOOL_PI_IP }}
          OWOOL_WIFI_SSID: ${{ OWOOL_WIFI_SSID }}
          OWOOL_WIFI_PASS: ${{ OWOOL_WIFI_PASS }}
        run: |
          jq --null-input \
             --arg ip "${{ OWOOL_PI_IP \
             --arg ws "${{ OWOOL_WIFI_SSID \
             --arg wp "${{ OWOOL_WIFI_PASS \
             '{MQTT_IP: $ip, WIFI_SSID: $ws, WIFI_PASS: $wp}' > env.json
          echo env.json
          
      - name: Push files to pico
        run: |
          for file in main.py lib/ test/ run-tests.py env.json; do ampy --port /dev/ttyACM1 put $file; done;
          ampy --port /dev/ttyACM1 ls
      - name: Run tests
        run: |
          ampy --port /dev/ttyACM1 run run-tests.py | tee testout.txt
          grep -q "FAILED" testout.txt && exit 1 || exit 0
