x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST:-rabbitmq}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  influx-env: &influx-env
    INFLUX_HOST: ${DATA_HOST:-influxdb}
    INFLUX_TOKEN: ${INFLUX_TOKEN}
    INFLUX_BUCKET: ${INFLUX_BUCKET}
    INFLUX_ORG: ${INFLUX_ORG}
  grafana-env: &grafana-env
    GRAFANA_HOST: ${DATA_HOST:-localhost}
    GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-}

name: comodo-core

services:
  config:
    image: docker.io/linkml/linkml
    command: linkml-validate -s schema.yaml config.yaml
    working_dir: /work
    volumes:
      - ../comodo.yaml:/work/config.yaml
      - ../schemas/comodo.yaml.schema:/work/schema.yaml

  mqtt-probe-core:
    image: comodolab/comodo-mqtt_probe:${COMODO_TAG:-latest}
    build:
      context: ../
      dockerfile: mqtt_probe/Dockerfile
    init: true
    environment:
      <<: *mqtt-env
      MQTT_PROBE_ID: core

  controller:
    image: comodolab/comodo-controller:${COMODO_TAG:-latest}
    build:
      context: ../
      dockerfile: controller/Dockerfile
    init: true
    environment:
      <<: [ *mqtt-env, *influx-env ]
    container_name: comodo-controller
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    volumes:
      - ../controller/data:/controller/data:rw
      - ../comodo.yaml:/app/comodo.yaml:ro

  ui:
    image: comodolab/comodo-ui:${COMODO_TAG:-latest}
    build:
      context: ../
      dockerfile: ui/Dockerfile
    init: true
    container_name: comodo-ui
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    ports:
      - '8501:8050'
    volumes:
      - ../comodo.yaml:/app/comodo.yaml:ro
      - ../ui/data:/ui_data:rw
    environment:
      <<: [ *mqtt-env, *influx-env, *grafana-env ]

  monitor:
    image: comodolab/comodo-monitor:${COMODO_TAG:-latest}
    build:
      context: ../
      dockerfile: monitor/Dockerfile
    init: true
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
    restart: unless-stopped
    environment:
      <<: [ *mqtt-env ]

# Shared by all the stacks on the same host. The first stack to start creates it,
# so the others warn that it "was not created for project ...", which is expected.
networks:
  default:
    name: comodo
