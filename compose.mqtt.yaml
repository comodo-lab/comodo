name: mqtt_broker
services:
  mqttui:
    # Run this with `docker compose run --build mqttui` and then run `mqttui` in the container
    build:
      context: .
      dockerfile_inline: |
        FROM alpine:3.22
        RUN apk update && apk add mqttui
    container_name: comodo-mqttui
    tty: true
    environment:
      MQTTUI_BROKER: mqtt://${MQTT_HOST}:1883
      MQTTUI_USERNAME: ${MQTT_USER}
      MQTTUI_PASSWORD: ${MQTT_PASS}
      MQTTUI_CLIENTID: mqttui-comodo
    profiles: [debug]
    networks:
      comodo:

  rabbitmq:
    build:
      context: .
      dockerfile_inline: |
        FROM rabbitmq:4.1.3
        RUN rabbitmq-plugins enable rabbitmq_mqtt
    container_name: comodo-rabbitmq
    restart: unless-stopped
    profiles: [mqtt]
    environment:
      RABBITMQ_DEFAULT_USER: ${MQTT_USER}
      RABBITMQ_DEFAULT_PASS: ${MQTT_PASS}
    ports:
      - '1883:1883'
    networks:
      comodo:

  mqtt-probe:
    image: eclipse-mosquitto:2
    command: tail -f /dev/null   # keep container running
    environment:
      MQTT_HOST: ${MQTT_HOST}
      MQTT_PORT: 1883
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
    healthcheck:
      test: ["CMD-SHELL", "/probe.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
    volumes:
      - ./nexus/probe.sh:/probe.sh:ro
    networks:
      comodo:

networks:
  comodo:
    name: comodo
