# This compose file runs the integration tests for the comodo stack and exits when done.
# Before running the tests, make sure you have copied the latest mock comodo yaml and regenerated the firmware compose:
#   cp utils/tests/mocks/comodo.yaml ./
#   docker compose -f "./firmware/compose.gen.yaml" run --rm compose-gen
# To run the tests, cd into integration_tests/ and execute:
#   docker compose --env-file ../.env up --build --attach integration-test --force-recreate
#   docker compose --env-file ../.env kill
#
# Note that pytest captures prints from the runner.py code, not from the stack itself.
# If debugging code in the stack, you need to attach to the service being debugged, e.g.:
#   docker compose --env-file ../.env up --build --attach integration-test  --attach monitor --force-recreate
# and then exit with Ctrl-C when done.
# Alternatively, you can just attach to everything except rabbitmq, e.g.:
#   docker compose --env-file ../.env up --build --no-attach rabbitmq --force-recreate

include:
  - path: ../compose.debug.yaml
  - path: ../compose.yaml
  # - path: ../compose.data.yaml
  - path: ../compose.mqtt.yaml
  - path: ../compose.firmware.yaml

services:
  integration-test:
    build:
      context: ../
      dockerfile: integration_tests/Dockerfile
    container_name: integration-test
    env_file:
      - ../.env
    environment:
      HEARTBEAT_TIMEOUT: ${HEARTBEAT_TIMEOUT:-20}
      EXPERIMENT_TIMEOUT: ${EXPERIMENT_TIMEOUT:-40}
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
