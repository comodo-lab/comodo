x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: rabbitmq
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  instrument-env: &instrument-env
    <<: *mqtt-env
    SIMULATE: true
  python-instrument-template: &python-instrument-template
    build:
      context: .
      dockerfile: firmware/Dockerfile
    networks:
      comodo-firmware:
      mcfe_mcfe:
    depends_on:
      mqtt-probe-firmware:
        condition: service_healthy

name: comodo-firmware
services:
  mqtt-probe-firmware:
    image: comodolab/comodo-mqtt_probe:latest
    environment:
      <<: *mqtt-env
    networks:
      comodo-firmware:
      mcfe_mcfe:

  furnace_centre:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "furnace_centre"
      FIRMWARE: carbolite_gero_thermocouple
      DEVICE_ADDRESS: 192.168.111.222
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  furnace_left:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "furnace_left"
      FIRMWARE: carbolite_gero_thermocouple
      DEVICE_ADDRESS: 192.168.111.224
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  furnace_right:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "furnace_right"
      FIRMWARE: carbolite_gero_thermocouple
      DEVICE_ADDRESS: 192.168.111.225
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  pressure_downstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "pressure_downstream"
      FIRMWARE: pfeiffer_mpt_200_pressure
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
      DEVICE_ADDRESS: /dev/ttyUSB1

  pressure_upstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "pressure_upstream"
      FIRMWARE: pfeiffer_mpt_200_pressure
      DEVICE_ADDRESS: /dev/ttyUSB0
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000

  mass_flow:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "mass_flow"
      FIRMWARE: el_flow_select_mass_flow
      DEVICE_ADDRESS: /dev/ttyUSB2
      HEARTBEAT_INTERVAL: 1000
      MEASUREMENT_INTERVAL: 1000
    volumes:
      - mass_flow_read:/shared

networks:
  comodo-firmware:
    name: comodo-firmware
  mcfe_mcfe:
    external: true

volumes:
  mass_flow_read:
