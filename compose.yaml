x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  influx-env: &influx-env
    INFLUX_HOST: ${DATA_HOST}
    INFLUX_TOKEN: ${INFLUX_TOKEN}
    INFLUX_BUCKET: ${INFLUX_BUCKET}
    INFLUX_ORG: ${INFLUX_ORG}
  grafana-env: &grafana-env
    GRAFANA_HOST: ${DATA_HOST}
    GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-}

name: comodo-core

services:
  config:
    image: docker.io/linkml/linkml
    command: linkml-validate -s schema.yaml config.yaml
    working_dir: /work
    volumes:
      - ./comodo.yaml:/work/config.yaml
      - ./comodo.yaml.schema:/work/schema.yaml

  mqtt-probe-core:
    build:
      context: ./
      dockerfile: mqtt_probe/Dockerfile
    environment:
      <<: *mqtt-env
    networks:
      comodo-core:

  controller:
    build:
      context: ./
      dockerfile: controller/Dockerfile
    environment:
      <<: [*mqtt-env, *influx-env]
    container_name: comodo-controller
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    volumes:
      - ./controller/data:/controller/data
      - ./messageSpec.yaml:/app/messageSpec.yaml:ro
    networks:
      comodo-core:

  ui:
    build:
      context: ./
      dockerfile: ui/Dockerfile
    container_name: comodo-ui
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    ports:
      - '8501:8050'
    environment:
      <<: [*mqtt-env, *influx-env, *grafana-env]
    networks:
      comodo-core:

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    volumes:
      - ./messageSpec.yaml:/app/asyncapi.yaml
    environment:
      <<: [*mqtt-env]
    networks:
      comodo-core:

networks:
  comodo-core:
    name: comodo-core
