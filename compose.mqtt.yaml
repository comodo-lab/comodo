name: mqtt_broker

services:

  rabbitmq:
    build:
      context: .
      dockerfile_inline: |
        FROM rabbitmq:4.1.3
        RUN rabbitmq-plugins enable rabbitmq_mqtt
    container_name: comodo-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${MQTT_USER}
      RABBITMQ_DEFAULT_PASS: ${MQTT_PASS}
    ports:
      - '1883:1883'
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  default:
    name: comodo
