
# This compose file runs the tests for the firmware and exits when done.
# To run the tests, cd into firmware/ and execute:
#   docker compose up --build
# To check coverage report, after tests have run, execute:
#   xdg-open $(docker volume inspect firmware-tests_memory -f '{{ .Mountpoint }}')/htmlcov/class_index.html

name: firmware-tests
services:
  firmware-test:
    image: comodo-firmware:testing
    build:
      context: ../
      dockerfile: firmware/Dockerfile
    container_name: firmware-test
    volumes:
      - memory:/memory  # Used to persist pytest cache between runs

    command: bash -c "coverage run --source=. --omit='tests/*,*/__*,utils/*,src/instruments/*' -m pytest -vv
      tests/ &&
      echo '' && coverage report && coverage html -d /memory/htmlcov"

volumes:
  memory:
