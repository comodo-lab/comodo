services:
  rabbitmq:
    image: docker.io/bitnami/rabbitmq:3.12
    container_name: comodo-rabbitmq
    restart: unless-stopped
    ports:
      - '1883:1883'
    environment:
      - RABBITMQ_SECURE_PASSWORD=yes
      - RABBITMQ_DISK_FREE_RELATIVE_LIMIT=1.0
      - RABBITMQ_DISK_FREE_ABSOLUTE_LIMIT=500MB
      - RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS=true
      - RABBITMQ_USERNAME=${MQTT_USER}
      - RABBITMQ_PASSWORD=${MQTT_PASS}
      - RABBITMQ_PLUGINS=rabbitmq_mqtt,rabbitmq_management
      - RABBITMQ_LOGS=-
    volumes:
      - rabbitmq_data:/bitnami/rabbitmq/mnesia
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      comodo:

  influxdb: 
    image: influxdb:2.0
    container_name: comodo-influx
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=influx
      - DOCKER_INFLUXDB_INIT_PASSWORD=influxinflux
      - DOCKER_INFLUXDB_INIT_ORG=comodo
      - DOCKER_INFLUXDB_INIT_BUCKET=comodo
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUX_TOKEN}
    ports:
      - 8086:8086
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    networks:
      comodo:

  telegraf:
    image: telegraf:latest
    container_name: comodo-telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
      - ORG=comodo
      - DATA_BUCKET=comodo
      - INFLUX_TOKEN=${INFLUX_TOKEN}
      - INFLUX_URL=http://comodo-influx:8086
      - RABBIT_URL=tcp://comodo-rabbitmq:1883
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      comodo:

  grafana:
    image: grafana/grafana
    container_name: comodo-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
    ports:
      - 3000:3000
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      comodo:

  controller:
    build:
      context: ./
      dockerfile: controller/Dockerfile
    container_name: comodo-controller
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./controller/data:/controller/data
      - ./controller/config/config.json:/controller/config/config.json
    environment:
      - INFLUX_TOKEN=${INFLUX_TOKEN}
    networks:
      comodo:
            
  ui:
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.13-slim
        COPY ui/requirements.txt ./requirements.txt
        RUN pip install -r ./requirements.txt
        COPY utils/mqtt_clients.py /app/mqtt_clients.py
        CMD ["python", "-u", "/app/app.py"]
    container_name: comodo-ui
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - '8050:8050'
    volumes:
      - ./ui/:/app/
      - ./controller/src/controller_helper.py:/app/controller_helper.py
    environment:
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    networks:
      - comodo

networks:
  comodo:
    name: comodo

volumes:
  rabbitmq_data:
    name: comodo-rabbitmq
  influx_data:
    name: comodo-influx
  influx_config:
    name: comodo-influx-config
  grafana-storage:
    name: comodo-grafana
