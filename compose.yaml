x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  influx-env: &influx-env
    INFLUX_HOST: ${DATA_HOST}
    INFLUX_TOKEN: ${INFLUX_TOKEN}
    INFLUX_BUCKET: ${INFLUX_BUCKET}
    INFLUX_ORG: ${INFLUX_ORG}
  grafana-env: &grafana-env
    GRAFANA_HOST: ${DATA_HOST}
    GRAFANA_DASHBOARD_URL: ${GRAFANA_DASHBOARD_URL:-}

name: comodo-core

services:
  config:
    image: docker.io/linkml/linkml
    command: linkml-validate -s schema.yaml config.yaml
    working_dir: /work
    volumes:
      - ./comodo.yaml:/work/config.yaml
      - ./schemas/comodo.yaml.schema:/work/schema.yaml

  mqtt-probe-core:
    build:
      context: ./
      dockerfile: mqtt_probe/Dockerfile
    environment:
      <<: *mqtt-env
      MQTT_PROBE_ID: core

  controller:
    build:
      context: ./
      dockerfile: controller/Dockerfile
    environment:
      <<: [ *mqtt-env, *influx-env ]
    container_name: comodo-controller
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    volumes:
      - ./controller/data:/controller/data:rw
      - ./schemas:/app/schemas/:rw
      - ./comodo.yaml:/app/comodo.yaml:ro

  ui:
    build:
      context: ./
      dockerfile: ui/Dockerfile
    container_name: comodo-ui
    restart: unless-stopped
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
      config:
        condition: service_completed_successfully
    ports:
      - '8501:8050'
    volumes:
      - ./comodo.yaml:/app/comodo.yaml:ro
    environment:
      <<: [ *mqtt-env, *influx-env, *grafana-env ]

  monitor:
    build:
      context: .
      dockerfile: monitor/Dockerfile
    depends_on:
      mqtt-probe-core:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./schemas/mqtt_schema.yaml:/app/schemas/mqtt_schema.yaml
    environment:
      <<: [ *mqtt-env ]
