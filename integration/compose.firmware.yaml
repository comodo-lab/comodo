x-sim-env: &sim-env
  MQTT_HOST: ${MQTT_HOST}
  MQTT_USER: ${MQTT_USER}
  MQTT_PASS: ${MQTT_PASS}
  SIMULATE: "true"
  HEARTBEAT_INTERVAL: 1000
  MEASUREMENT_INTERVAL: 1000

x-rabbitmq-dep: &rabbitmq-dep
  rabbitmq:
    condition: service_healthy

services:
  furnace:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
    environment:
      <<: *sim-env
      INSTRUMENT_ID: "furnace"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: 192.168.111.222
    depends_on:
      <<: *rabbitmq-dep

  furnace_left:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
    environment:
      <<: *sim-env
      INSTRUMENT_ID: "furnace_left"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: 192.168.111.224
    depends_on:
      <<: *rabbitmq-dep

  furnace_right:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
    environment:
      <<: *sim-env
      INSTRUMENT_ID: "furnace_right"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: 192.168.111.225
    depends_on:
      <<: *rabbitmq-dep

  pressure_downstream:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
    environment:
      <<: *sim-env
      INSTRUMENT_ID: "pressure_downstream"
      FIRMWARE: pfeiffer.mpt200
    depends_on:
      <<: *rabbitmq-dep

  pressure_upstream:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
    environment:
      <<: *sim-env
      INSTRUMENT_ID: "pressure_upstream"
      FIRMWARE: pfeiffer.mpt200
    depends_on:
      <<: *rabbitmq-dep

  massflow:
    build:
      context: ..
      dockerfile: firmware/Dockerfile
    environment:
      <<: *sim-env
      INSTRUMENT_ID: "massflow"
      FIRMWARE: bronkhorst.el_flow_select
    depends_on:
      <<: *rabbitmq-dep

  setpoint-controller:
    build:
      context: ..
      dockerfile: setpoint_controller/Dockerfile
    environment:
      <<: *sim-env
      SENSOR: "pressure_upstream.pressure"
      ACTUATOR: "massflow.massflow"
      K_P: 1
      K_I: 0.1
      K_D: 0.05
      K_AW: 0.05
      K_DF: 0.01
      OUT_MIN: 0
      OUT_MAX: 100
    depends_on:
      <<: *rabbitmq-dep
