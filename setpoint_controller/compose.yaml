
# This compose file runs the tests for the setpoint controller and exits when done.
# To run the tests, cd into setpoint_controller/ and execute:
#   docker compose up --build

name: setpoint_controller-tests
services:
  setpoint_controller:
    image: comodo-setpoint_controller:testing
    build:
      context: ../
      dockerfile: setpoint_controller/Dockerfile
    container_name: setpoint_controller-test
    volumes:
      - memory:/memory  # Used to persist pytest cache between runs
    command: bash -c "coverage run -m pytest
      tests/ -vv &&
      echo '' && coverage report && coverage html -d /memory/htmlcov"

volumes:
  memory:
