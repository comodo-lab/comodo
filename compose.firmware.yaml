# Generated by compose-gen from comodo.yaml
# Do not edit directly -- edit comodo.yaml and regenerate.

x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
  instrument-env: &instrument-env
    <<: *mqtt-env
  python-instrument-template: &python-instrument-template
    build:
      context: .
      dockerfile: firmware/Dockerfile
    depends_on:
      mqtt-probe-firmware:
        condition: service_healthy

name: comodo-firmware

services:
  mqtt-probe-firmware:
    build:
      context: ./
      dockerfile: mqtt_probe/Dockerfile
    environment:
      <<: *mqtt-env
      MQTT_PROBE_ID: firmware


  furnace:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "furnace"
      FIRMWARE: carbolite_gero.tg3
      DEVICE_ADDRESS: "192.168.111.222"
      ACTIVE_VARIABLES: '["temperature"]'
      DEFAULT_SETPOINTS: '{"temperature": 25}'
      SAFE_STOP_SETPOINTS: '{"temperature": 0}'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_TEMPERATURE: 1000

  pressure:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "pressure"
      FIRMWARE: pfeiffer.mpt200
      DEVICE_ADDRESS: "/dev/ttyUSB0"
      ACTIVE_VARIABLES: '["pressure"]'
      DEFAULT_SETPOINTS: '{"pressure": 1}'
      SAFE_STOP_SETPOINTS: 'null'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_PRESSURE: 1000
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true

  mass_flow:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_NAME: "mass_flow"
      FIRMWARE: bronkhorst.el_flow_select
      DEVICE_ADDRESS: "/dev/ttyUSB2"
      ACTIVE_VARIABLES: '["mass_flow"]'
      DEFAULT_SETPOINTS: 'null'
      SAFE_STOP_SETPOINTS: '{"mass_flow": 0}'
      HEARTBEAT_INTERVAL: 1000
      INTERVAL_MASS_FLOW: 1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true


  spc-mass_flow-mass_flow:
    build:
      context: .
      dockerfile: setpoint_controller/Dockerfile
    depends_on:
      mqtt-probe-firmware:
        condition: service_healthy
    environment:
      <<: *mqtt-env
      HEARTBEAT_INTERVAL: 1000
      SENSOR: "pressure/pressure"
      DEFAULT_SETPOINT: 1
      ACTUATOR: "mass_flow/mass_flow"
      K_P: 10.0
      K_I: 1.0
      K_D: 0.1
      K_AW: 0.05
      K_DF: 0.01
      OUT_MIN: 0
      OUT_MAX: 100


volumes:
  massflow_read:

