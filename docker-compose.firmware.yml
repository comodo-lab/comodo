version: '3.9'

micropython-sensor-base: &micropython-sensor-template
  build:
    context: firmware
    dockerfile: Dockerfile-micropython
  network_mode: host

python-sensor-base: &python-sensor-template
  build:
    context: firmware
    dockerfile: Dockerfile-python
  network_mode: host

name: comodo-firmware
services:
  temp_main:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=temp_main
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

  temp_left:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=temp_left
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

  temp_right:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=temp_right
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

  pressure_downstream:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=pressure_downstream
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true  # Optional but recommended for USB/serial access
