asyncapi: 3.0.0
info:
  title: Comodo Message Specification
  description: >
    Message definitions for the Comodo experiment automation platform.

channels:
  mqtt-probe:
    address: mqtt-probe/+
    messages:
      mqttProbeMessage:
        payload:
          type: object
          additionalProperties: false
          required:
            - uid
          properties:
            uid:
              type: number

  uiStart:
    address: ui/start
    messages:
      experimentStart:
        payload:
          type: object
          additionalProperties: false
          required:
            - temp_id
            - config
            - experiment_definition
          properties:
            temp_id:
              type: string
            config:
              type: object
              additionalProperties: true
              properties:
                instruments:
                  type: object
                  additionalProperties:
                    type: object
                spcs:
                  type: object
                  additionalProperties:
                    type: object
                    additionalProperties: false
                    required:
                      - pid
                    properties:
                      pid:
                        type: object
                        additionalProperties: false
                        required:
                          - k_p
                          - k_i
                          - k_d
                          - k_df
                          - k_aw
                          - max_rate
                        properties:
                          k_p:
                            type: number
                          k_i:
                            type: number
                          k_d:
                            type: number
                          k_df:
                            type: number
                          k_aw:
                            type: number
                          max_rate:
                            oneOf:
                              - type: number
                              - type: "null"
            experiment_definition:
              type: array
              items:
                type: object
                additionalProperties: true
  uiStop:
    address: ui/stop
    messages:
      experimentStop:
        payload:
          type: object
          additionalProperties: false
          properties:
            experiment_id:
              type: string

  uiReset:
    address: ui/reset
    messages:
      resetRequest:
        payload:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              type: string

  controllerTimerCommandStart:
    address: controller/timer/command/start
    messages:
      timerStartCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - source
            - experiment_id
          properties:
            source:
              type: string
              enum:
                - instrument_setup
                - setpoint
            experiment_id:
              type: string
            duration:
              type: number

  controllerTimerEventDone:
    address: controller/timer/event/done
    messages:
      timerDoneEvent:
        payload:
          type: object
          additionalProperties: false
          required:
            - source
            - experiment_id
          properties:
            source:
              type: string
              enum:
                - instrument_setup
                - setpoint
            experiment_id:
              type: string
            controller_status:
              type: string
            instruments_configured:
              type: boolean

  controllerValidatorPassed:
    address: controller/validator/passed
    messages:
      validatorPassed:
        payload:
          type: object
          additionalProperties: false
          required:
            - temp_id
            - experiment_id
            - valid
          properties:
            temp_id:
              type: string
            experiment_id:
              type: string
            valid:
              type: boolean

  controllerCommandValidate:
    address: controller/command/validate
    messages:
      validateCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - temp_id
            - file
          properties:
            temp_id:
              type: string
            file:
              type: string

  controllerCommandStart:
    address: controller/command/start
    messages:
      startCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerCommandRun:
    address: controller/command/run
    messages:
      runCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerCommandStop:
    address: controller/command/stop
    messages:
      stopCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerCommandReset:
    address: controller/command/reset
    messages:
      resetCommand:
        payload:
          type: object
          additionalProperties: false
          properties:
            source:
              type: string

  controllerEventReady:
    address: controller/event/ready
    messages:
      readyEvent:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerEventEnd:
    address: controller/event/end
    messages:
      endEvent:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  watchdogCommandStart:
    address: watchdog/timer/command/start
    messages:
      watchdogStart:
        payload:
          type: object
          additionalProperties: false
          required:
            - source
          properties:
            source:
              type: string

  watchdogEventRestart:
    address: watchdog/timer/event/restart_triggered
    messages:
      watchdogRestart:
        payload:
          type: object
          additionalProperties: false
          required:
            - message
          properties:
            message:
              type: string

  watchdogEventTimeout:
    address: watchdog/timer/event/timeout
    messages:
      watchdogTimeout:
        payload:
          type: object
          additionalProperties: false
          required:
            - error
          properties:
            error:
              type: string

  error:
    address: error/+
    messages:
      errorMessage:
        payload:
          type: object
          additionalProperties: true
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string

  controllerHeartbeat:
    address: controller/heartbeat
    messages:
      controllerHeartbeat:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
            - setpoints
            - state
          properties:
            config:
              type: object
              additionalProperties: false
              required:
                - experiment_id
              properties:
                experiment_id:
                  oneOf:
                    - type: string
                    - type: "null"

            setpoints:
              type: object
              additionalProperties:
                type: number

            state:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - idle
                    - validating
                    - starting
                    - awaiting_instruments
                    - ready
                    - running
                    - stopping
                    - error
                variables:
                  type: object
                  additionalProperties:
                    type: string
                    enum:
                      - no_heartbeat
                      - no_measurement
                      - at_setpoint
                      - adjusting

  setpointControllerHeartbeat:
    address: setpoint_controllers/+/heartbeat
    messages:
      setpointControllerHeartbeat:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
            - setpoints
            - state
          properties:
            config:
              type: object
              additionalProperties: false
              required:
                - sensor
                - actuator
                - pid
              properties:
                sensor:
                  type: string
                actuator:
                  type: string
                pid:
                  type: object
                  additionalProperties: false
                  required:
                    - k_p
                    - k_i
                    - k_d
                    - k_df
                    - k_aw
                    - max
                    - min
                    - max_rate
                  properties:
                    k_p:
                      type: number
                    k_i:
                      type: number
                    k_d:
                      type: number
                    k_df:
                      type: number
                    k_aw:
                      type: number
                    max:
                      type: number
                    min:
                      type: number
                    max_rate:
                      oneOf:
                        - type: number
                        - type: "null"

            setpoints:
              type: object
              additionalProperties: false
              required:
                - sensor_setpoint
              properties:
                sensor_setpoint:
                  oneOf:
                    - type: number
                    - type: "null"

            state:
              type: object
              additionalProperties: false
              required:
                - status
                - enabled
                - sensor_measurement
                - actuator_setpoint
                - experiment_id
              properties:
                status:
                  type: string
                  enum:
                    - idle
                    - adjusting
                    - ready
                    - error
                enabled:
                  type: boolean
                sensor_measurement:
                  oneOf:
                    - type: number
                    - type: "null"
                actuator_setpoint:
                  oneOf:
                    - type: number
                    - type: "null"
                experiment_id:
                  oneOf:
                    - type: string
                    - type: "null"

  setpointControllerConfiguration:
    address: setpoint_controllers/+/configure
    messages:
      setpointControllerConfiguration:
        payload:
          type: object
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            experiment_id:
              type: string
            pid:
              type: object
              additionalProperties: false
              properties:
                k_p:
                  type: number
                k_i:
                  type: number
                k_d:
                  type: number
                k_df:
                  type: number
                k_aw:
                  type: number
                max:
                  type: number
                min:
                  type: number
                max_rate:
                  oneOf:
                    - type: number
                    - type: "null"

  instrumentHeartbeat:
    address: instruments/+/heartbeat
    messages:
      instrumentHeartbeat:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
            - setpoints
            - state
          properties:
            config:
              type: object
              properties:
                name:
                  type: string
                firmware:
                  type: string
                address:
                  type: string
                simulate:
                  type: boolean
                variables:
                  type: array
                  items:
                    type: string
                default_setpoints:
                  type: object
                  additionalProperties:
                    type: number
                safe_stop_setpoints:
                  type: object
                  additionalProperties:
                    type: number
                measurement_intervals:
                  type: object
                  additionalProperties:
                    type: number
                heartbeat_interval:
                  type: number
                max_missed_heartbeats:
                  type: number
                experiment:
                  type: object
                  additionalProperties: true

            setpoints:
              type: object
              additionalProperties:
                type: number

            state:
              type: object
              additionalProperties: false
              required:
                - status
                - measurements
              properties:
                status:
                  type: string
                  enum:
                    - initialising
                    - awaiting_experiment
                    - running
                    - error
                    - safe_stop
                measurements:
                  type: object
                  # null until the variable is first measured
                  additionalProperties:
                    type:
                      - number
                      - "null"

  instrumentConfiguration:
    address: instruments/+/configure
    messages:
      instrumentConfiguration:
        payload:
          type: object
          additionalProperties: true

  instrumentSetpoint:
    address: instruments/+/+/setpoint
    messages:
      instrumentSetpoint:
        payload:
          type: object
          additionalProperties: false
          required:
            - value
          properties:
            value:
              type: number

  instrumentMeasurement:
    address: instruments/+/+/measurement
    messages:
      instrumentMeasurement:
        payload:
          type: object
          additionalProperties: false
          required:
            - value
          properties:
            value:
              type: number
