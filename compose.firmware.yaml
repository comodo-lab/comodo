x-templates:
  micropython-sensor-template: &micropython-sensor-template
    build:
      context: firmware
      dockerfile: Dockerfile-micropython
    networks:
      comodo-network:

  python-sensor-template: &python-sensor-template
    build:
      context: firmware
      dockerfile: Dockerfile-python
    networks:
      comodo-network:

name: comodo-firmware
services:
  temp_main:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=temp_main
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

  temp_left:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=temp_left
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

  temp_right:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=temp_right
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

  pressure_downstream:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=pressure_downstream
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB0:/dev/ttyUSB0"
    privileged: true

  pressure_upstream:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=pressure_upstream
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB1:/dev/ttyUSB1"
    privileged: true  # Optional but recommended for USB/serial access

  massflow:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=massflow
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true  # Optional but recommended for USB/serial access

  massflow_temp:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=massflow_temp
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true
  massflow_pressure_upstream:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=massflow_pressure_upstream
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true

  massflow_pressure_downstream:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=massflow_pressure_downstream
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true
    
  massflow_fluid_temp:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=massflow_fluid_temp
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000
    devices:
      - "/dev/ttyUSB2:/dev/ttyUSB2"
    privileged: true

  mass_spec:
    <<: *python-sensor-template
    environment:
      - SENSOR_ID=mass_spec
      - HEARTBEAT_INTERVAL=1000
      - MEASUREMENT_INTERVAL=1000

networks:
  comodo-network:
    name: comodo
    external: true
