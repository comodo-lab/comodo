[agent]
  omit_hostname = true
  debug = true
  quiet = false
  logtarget = "stderr"  # or "stderr"

################################################################################
# Inputs

[[inputs.mqtt_consumer]]
  servers = ["tcp://${MQTT_HOST}:1883"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  client_id = "telegraf"

  topics = [
    "#",
  ]

  data_format = "json_v2"
  
  [[inputs.mqtt_consumer.json_v2]]
    [[inputs.mqtt_consumer.json_v2.object]]
       path = "@this"
       tags = [""]
       disable_prepend_keys = true

################################################################################
# Outputs

[[outputs.influxdb_v2]]
urls = ["${INFLUX_ADDR}"]
token = "${INFLUX_TOKEN}"
organization = "${INFLUX_ORG}"
bucket = "${INFLUX_BUCKET}"

#[[outputs.file]]
  
################################################################################
# Processors

[[processors.starlark]]
 # Reads the Starlark script embedded
 source = '''
load("logging.star", "log")
def apply(metric):
  new_fields = {}
  for k, v in metric.fields.items():
    if type(v) == "dict":
      for sk, sv in v.items():
        if type(sv) == "float" or type(sv) == "string":
          new_fields[sk] = sv
    elif type(v) == "float" or type(v) == "string":
      new_fields[k] = v
  metric.fields = new_fields
  return metric
'''

[[processors.pivot]]
    tag_key = "field"
    value_key = "value"
