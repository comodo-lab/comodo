channels:
  experimentRow:
    address: experiment/row
    messages:
      experimentRow:
        payload:
          type: object
          additionalProperties: false
          required:
          - time
          - furnace/temperature
          - pressure/pressure
          properties:
            time:
              type: number
              minimum: 0
            furnace/temperature:
              type: number
              minimum: 0
              maximum: 1000
            furnace/temperature_profile:
              type: string
              enum:
              - linear
              - exponential
              - logarithmic
              - step
            pressure/pressure:
              type: number
              minimum: 0
              maximum: 10
            pressure/pressure_profile:
              type: string
              enum:
              - linear
              - exponential
              - logarithmic
              - step
