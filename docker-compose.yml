services:
  rabbitmq:
    image: docker.io/bitnami/rabbitmq:3.12
    container_name: comodo-rabbitmq
    restart: unless-stopped
    ports:
      - '1883:1883'
    environment:
      - RABBITMQ_SECURE_PASSWORD=yes
      - RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS=true
      - RABBITMQ_USERNAME=${MQTT_USER}
      - RABBITMQ_PASSWORD=${MQTT_PASS}
      - RABBITMQ_PLUGINS=rabbitmq_mqtt,rabbitmq_management
      - RABBITMQ_LOGS=-
    volumes:
      - rabbitmq_data:/bitnami/rabbitmq/mnesia
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      comodo:

  influxdb: 
    image: influxdb:2.0
    container_name: comodo-influx
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=influx
      - DOCKER_INFLUXDB_INIT_PASSWORD=influxinflux
      - DOCKER_INFLUXDB_INIT_ORG=comodo
      - DOCKER_INFLUXDB_INIT_BUCKET=defualt
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=influxinfluxinfluxinflux
    volumes:
      - influx_data:/var/lib/influxdb2
      - influx_config:/etc/influxdb2
    networks:
      comodo:

  telegraf:
    image: telegraf:latest
    container_name: comodo-telegraf
    restart: unless-stopped
    depends_on:
      - influxdb
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    networks:
      comodo:

  grafana:
    image: grafana/grafana
    container_name: comodo-grafana
    restart: unless-stopped
    environment:
      - GF_AUTH_LDAP_ENABLED=true
      - GF_AUTH_LDAP_CONFIG_FILE=/etc/grafana/ldap.toml
      - GF_AUTH_LDAP_ALLOW_SIGN_UP=true
    volumes:
      - grafana-storage:/var/lib/grafana
    networks:
      comodo:

  controller:
    build:
      context: ./controller
      dockerfile: Dockerfile
    container_name: comodo-controller
    restart: unless-stopped
    volumes:
      - ./controller/data:/controller/data
    networks:
      comodo:

  ui:
    build:
      context: ../FASE-ui
      dockerfile: Dockerfile
    container_name: fase-ui
    restart: unless-stopped
    networks:
      comodo:

networks:
  comodo:
    name: comodo

volumes:
  rabbitmq_data:
    name: comodo-rabbitmq
  influx_data:
    name: comodo-influx
  influx_config:
    name: comodo-influx-config
  grafana-storage:
    name: comodo-grafana
