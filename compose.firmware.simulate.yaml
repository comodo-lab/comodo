x-templates:
  instrument-env: &instrument-env
    MQTT_HOST: rabbitmq
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}
    SIMULATE: "true"
    HEARTBEAT_INTERVAL: 1000
    MEASUREMENT_INTERVAL: 1000
  python-instrument-template: &python-instrument-template
    build:
      context: .
      dockerfile: firmware/Dockerfile
    networks:
      mcfe_mcfe:

name: comodo-firmware-simulate
services:
  furnace_centre:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "furnace_centre/temperature"
      FIRMWARE: carbolite_gero_thermocouple

  furnace_left:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "furnace_left/temperature"
      FIRMWARE: carbolite_gero_thermocouple

  furnace_right:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "furnace_right/temperature"
      FIRMWARE: carbolite_gero_thermocouple

  pressure_downstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "pressure_downstream/pressure"
      FIRMWARE: pfeiffer_mpt_200_pressure

  pressure_upstream:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "pressure_upstream/pressure"
      FIRMWARE: pfeiffer_mpt_200_pressure

  mass_flow:
    <<: *python-instrument-template
    environment:
      <<: *instrument-env
      INSTRUMENT_ID: "mass_flow/mass_flow"
      FIRMWARE: el_flow_select_massflow
    volumes:
      - massflow_read:/shared

  setpoint-controller:
    build:
      context: .
      dockerfile: setpoint_controller/Dockerfile
    networks:
      mcfe_mcfe:
    environment:
      MQTT_HOST: rabbitmq
      MQTT_USER: ${MQTT_USER}
      MQTT_PASS: ${MQTT_PASS}
      HEARTBEAT_INTERVAL: 1000
      SENSOR: "pressure_upstream/pressure"
      ACTUATOR: "mass_flow/mass_flow"
      K_P: 1
      K_I: 0.1
      K_D: 0.05
      K_AW: 0.05
      K_DF: 0.01
      OUT_MIN: 0
      OUT_MAX: 100

networks:
  mcfe_mcfe:
    external: true

volumes:
  massflow_read:
