name: setpoint_controller build-test-push # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #

on:
  workflow_dispatch:
    inputs:
      versioned_tag:
        description: "Push with versioned tag? Set to '' to skip"
        required: false
        type: string
        default: "auto" # Semantic versioning based on commits
      latest_tag:
        description: "Push with latest tag? Set to '' to skip"
        required: false
        type: string
        default: "latest"
  push:
    branches: ["main", "dev"] # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
    paths:
      - "setpoint_controller/**" # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
      - "utils/**" # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #

# --------------------------------------------------------------------------------- #

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    env:
      CONTAINER_NAME: comodo-setpoint_controller # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
      ORG_NAME: comodolab # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
      CONTEXT: . # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
      DOCKERFILE: ./setpoint_controller/Dockerfile # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT }}
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: ${{ env.CONTAINER_NAME }}:testing
          cache-from: type=gha,scope=${{ env.CONTAINER_NAME }}
          cache-to: type=gha,scope=${{ env.CONTAINER_NAME }},mode=max

      - name: Test # <<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<<< #
        run: |
          set -eo pipefail
          cd ./setpoint_controller
          docker compose up --abort-on-container-exit --exit-code-from setpoint_controller

      - name: Version
        id: version
        uses: paulhatch/semantic-version@v5.4.0
        with:
          search_commit_body: true
          namespace: ${{ env.CONTAINER_NAME }}

      - name: Set tag variables
        id: vars
        run: |
          if [ "${{ github.event.inputs.versioned_tag }}" == "auto" ]; then
            echo "VERSIONNED_TAG=${{ steps.version.outputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSIONNED_TAG=${{ github.event.inputs.versioned_tag }}" >> $GITHUB_ENV
          fi
          echo "LATEST_TAG=${{ github.event.inputs.latest_tag }}" >> $GITHUB_ENV
          echo "Versioned Tag: ${{ env.VERSIONNED_TAG }}"
          echo "Latest Tag: ${{ env.LATEST_TAG }}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push versioned
        if: ${{ github.event.inputs.versioned_tag != '' }}
        run: |
          docker image tag ${{ env.CONTAINER_NAME }}:testing ${{ env.ORG_NAME }}/${{ env.CONTAINER_NAME }}:${{ env.VERSIONNED_TAG }}
          docker push ${{ env.ORG_NAME }}/${{ env.CONTAINER_NAME }}:${{ env.VERSIONNED_TAG }}

      - name: Push latest
        if: ${{ github.event.inputs.latest_tag != '' }}
        run: |
          docker image tag ${{ env.CONTAINER_NAME }}:testing ${{ env.ORG_NAME }}/${{ env.CONTAINER_NAME }}:${{ env.LATEST_TAG }}
          docker push ${{ env.ORG_NAME }}/${{ env.CONTAINER_NAME }}:${{ env.LATEST_TAG }}
