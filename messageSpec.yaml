asyncapi: 3.0.0
info:
  title: Comodo Message Specification
  version: "0.3.0"
  description: >
    Minimal strict protocol contract for the Comodo experiment automation platform.

channels:

  uiStart:
    address: ui/start
    messages:
      experimentStart:
        payload:
          type: object
          additionalProperties: false
          required:
            - id
            - config
            - experiment_definition
          properties:
            id:
              type: string
            config:
              type: object
              additionalProperties: true
            experiment_definition:
              type: object
              additionalProperties: true

  controllerTimerStartInstrumentSetup:
    address: controller/timer/start/instrument_setup
    messages:
      timerStartInstrumentSetup:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerTimerStartSetpoint:
    address: controller/timer/start/setpoint
    messages:
      setpointTimerStart:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
            - duration
          properties:
            experiment_id:
              type: string
            duration:
              type: number

  controllerTimerDone:
    address: controller/timer/done
    messages:
      timerDone:
        payload:
          type: object
          additionalProperties: false

  controllerValidatorPassed:
    address: controller/validator/passed
    messages:
      validatorPassed:
        payload:
          type: object
          additionalProperties: false
          required:
            - id
            - valid
          properties:
            id:
              type: string
            valid:
              type: boolean

  controllerCommandValidate:
    address: controller/command/validate
    messages:
      validateCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - id
            - file
          properties:
            id:
              type: string
            file:
              type: string

  controllerCommandStart:
    address: controller/command/start
    messages:
      startCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - id
          properties:
            id:
              type: string

  controllerCommandRun:
    address: controller/command/run
    messages:
      runCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerCommandStop:
    address: controller/command/stop
    messages:
      stopCommand:
        payload:
          type: object
          additionalProperties: false
          required:
            - id
          properties:
            id:
              type: string

  controllerEventReady:
    address: controller/event/ready
    messages:
      readyEvent:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerEventEnd:
    address: controller/event/end
    messages:
      endEvent:
        payload:
          type: object
          additionalProperties: false
          required:
            - experiment_id
          properties:
            experiment_id:
              type: string

  controllerErrorMalformedJson:
    address: error/controller/malformed_json
    messages:
      controllerMalformedJson:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
            - error_message
          properties:
            topic:
              type: string
            error:
              type: string
              enum:
                - invalid_json
            error_message:
              type: string

  controllerErrorMissingKey:
    address: error/controller/missing_key
    messages:
      controllerMissingKey:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
            - message
          properties:
            topic:
              type: string
            error:
              type: string
              enum:
                - missing_key
            message:
              type: string

  controllerErrorIncompatibleRequest:
    address: error/controller/incompatible_request
    messages:
      controllerIncompatibleRequest:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
          properties:
            topic:
              type: string
            error:
              type: string
              enum:
                - incompatible_request

  controllerErrorIncompatibleUid:
    address: error/controller/incompatible_uid
    messages:
      controllerIncompatibleUid:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
            - message
          properties:
            topic:
              type: string
            error:
              type: string
              enum:
                - incompatible_uid
            message:
              type: string

  controllerHeartbeat:
    address: controller/heartbeat
    messages:
      controllerHeartbeat:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
            - setpoints
            - state
          properties:
            config:
              type: object
              additionalProperties: false
              required:
                - experiment_id
              properties:
                experiment_id:
                  oneOf:
                    - type: string
                    - type: "null"

            setpoints:
              type: object
              additionalProperties:
                type: number

            state:
              type: string
              enum:
                - idle
                - validating
                - starting
                - awaiting_instruments
                - ready
                - running
                - stopping
                - error

  setpointControllerHeartbeat:
    address: setpoint_controller/heartbeat
    messages:
      setpointControllerHeartbeat:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
            - setpoints
            - state
          properties:
            config:
              type: object
              additionalProperties: false
              required:
                - sensor
                - actuator
                - active
                - k_p
                - k_i
                - k_d
                - k_df
                - k_aw
                - max
                - min
                - max_rate
                - experiment_id
              properties:
                sensor:
                  type: string
                actuator:
                  type: string
                active:
                  type: boolean
                k_p:
                  type: number
                k_i:
                  type: number
                k_d:
                  type: number
                k_df:
                  type: number
                k_aw:
                  type: number
                max:
                  type: number
                min:
                  type: number
                max_rate:
                  type: number
                experiment_id:
                  type: string

            setpoints:
              type: object
              additionalProperties:
                type: number

            state:
              type: string
              enum:
                - idle
                - adjusting
                - ready
                - error

  instrumentSetup:
    address: instruments/+/setup
    messages:
      instrumentSetup:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
          properties:
            config:
              type: object
              additionalProperties: false
              required:
                - tolerance
                - experiment_id
              properties:
                tolerance:
                  type: number
                experiment_id:
                  type: string

  instrumentHeartbeat:
    address: instruments/+/heartbeat
    messages:
      instrumentHeartbeat:
        payload:
          type: object
          additionalProperties: false
          required:
            - config
            - setpoints
            - state
          properties:
            config:
              type: object
              additionalProperties: false
              required:
                - tolerance
                - experiment_id
              properties:
                tolerance:
                  oneOf:
                    - type: number
                    - type: "null"
                experiment_id:
                  oneOf:
                    - type: string
                    - type: "null"

            setpoints:
              type: object
              additionalProperties:
                type: number

            state:
              type: string
              enum:
                - idle
                - adjusting
                - ready
                - error

  instrumentSetpoint:
    address: instruments/+/+/setpoint
    messages:
      instrumentSetpoint:
        payload:
          type: object
          additionalProperties: false
          required:
            - value
          properties:
            value:
              type: number

  instrumentMeasurement:
    address: instruments/+/+/measurement
    messages:
      instrumentMeasurement:
        payload:
          type: object
          additionalProperties: false
          required:
            - value
          properties:
            value:
              type: number
              
  errorMqtt:
    address: error/mqtt
    messages:
      genericError:
        payload:
          type: object
          additionalProperties: false
          required:
            - error
          properties:
            error:
              type: string

  errorInvalid:
    address: error/message/invalid
    messages:
      validationErrorMsg:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
            - message
          properties:
            topic:
              type: string
            channel:
              type: string
            error:
              type: string
              enum:
                - validation_error
            path:
              type: array
              items:
                type: string
            message:
              type: string

  errorMalformed:
    address: error/message/malformed
    messages:
      malformedPayloadMsg:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
            - error_message
          properties:
            topic:
              type: string
            error:
              type: string
              enum:
                - invalid_json
            error_message:
              type: string

  errorUnexpected:
    address: error/message/unexpected
    messages:
      unexpectedTopicErrorMsg:
        payload:
          type: object
          additionalProperties: false
          required:
            - topic
            - error
          properties:
            topic:
              type: string
            error:
              type: string
              enum:
                - unexpected_topic
