experiment:
  global:
    measurement_interval: 1s
  parameters:
    temperature_centre:
      sensor: # experiment/sensor/temperature_centre
        data_type: float
        min: 0
        max: 1e3
      actuator: # experiment/actuator/temperature_centre
        type: float
        min: 0
        max: 1e3
    temperature_left:
      sensor:
        type: float
      actuator:
        type: float
    temperature_right:
      sensor:
        type: float
      actuator:
        type: float

visualisation:
  graph_1:
    type: graph
    y_values:
      - temperature_left
      - temperature_centre
      - temperature_right
  gauge_1:
    type: gauge
    value:
      - temperature_centre
