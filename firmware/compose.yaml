
# This compose file runs the firmware integration tests and exits when done.
# To run the tests:
#   docker compose -f compose.yaml up --build
name: firmware-integration-tests
services:
  firmware-test:
    image: comodo-firmware:testing
    build:
      context: ../
      dockerfile: firmware/Dockerfile
    container_name: firmware-test
    volumes:
      - memory:/memory  # Used to persist pytest cache between runs

    command: coverage run --source=. --omit='tests/*,*/__*' -m pytest
      tests/integration/ --tb=short -vv -x &&
      echo '' && coverage report && coverage html -d /memory/htmlcov

volumes:
  memory:
