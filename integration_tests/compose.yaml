# This compose file runs the integration test runner against an already running comodo stack, and exits when done.
# It does not start the stack: use integration_tests/run-integration-tests.sh, which starts the stacks with the mock configuration,
# runs this, and tears everything down. See integration_tests/README.md for details.
#
# To run only the test runner (from the repository root), against a stack started with the mock configuration:
#   docker compose --env-file .env -f integration_tests/compose.yaml run --rm --build integration-test
#
# Note that pytest captures prints from the integration_tests.py code, not from the stack itself.

x-templates:
  mqtt-env: &mqtt-env
    MQTT_HOST: ${MQTT_HOST:-rabbitmq}
    MQTT_USER: ${MQTT_USER}
    MQTT_PASS: ${MQTT_PASS}

name: comodo-integration

services:
  mqtt-probe-integration:
    build:
      context: ../
      dockerfile: mqtt_probe/Dockerfile
    environment:
      <<: *mqtt-env
      MQTT_PROBE_ID: integration

  integration-test:
    build:
      context: ../
      dockerfile: integration_tests/Dockerfile
    container_name: integration-test
    environment:
      <<: *mqtt-env
      INFLUX_URL: http://${DATA_HOST:-influxdb}:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_ORG: ${INFLUX_ORG}
      HEARTBEAT_TIMEOUT: ${HEARTBEAT_TIMEOUT:-20}
      SETPOINT_TIMEOUT: ${SETPOINT_TIMEOUT:-30}
      EXPERIMENT_TIMEOUT: ${EXPERIMENT_TIMEOUT:-40}
      INFLUX_TIMEOUT: ${INFLUX_TIMEOUT:-30}
    volumes:
      # The core stack always runs on this machine
      - ../controller/data:/controller_data:ro
    depends_on:
      mqtt-probe-integration:
        condition: service_healthy

# Shared by all the stacks on the same host. The first stack to start creates it,
# so the others warn that it "was not created for project ...", which is expected.
networks:
  default:
    name: comodo
